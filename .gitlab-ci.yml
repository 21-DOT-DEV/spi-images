image: docker:latest

stages:
  - base
  - derived

build base image:
  stage: base
  only:
    - main
    - tags
    - branches
  services:
    - docker:dind
  variables:
    # This instructs Docker not to start over TLS, which is often easier
    # for basic setups on shared runners.
    DOCKER_TLS_CERTDIR: ""
    FF_NETWORK_PER_BUILD: "true"
  parallel:
    matrix:
      - SWIFT_VERSION:
          - '6.4.beta'
          - '6.3.2'
          - '6.2.4'
          - '6.1.3'
  script: |
    BASENAME=basic
    SHORT_SWIFT_VERSION=${SWIFT_VERSION%.*}  # 5.7.3 -> 5.7
    if [ -n "$CI_COMMIT_TAG" ]; then
      IMAGE=$CI_REGISTRY_IMAGE:$BASENAME-$SHORT_SWIFT_VERSION-$CI_COMMIT_TAG
    elif [ "$CI_COMMIT_REF_NAME" = "$CI_DEFAULT_BRANCH" ]; then
      IMAGE=$CI_REGISTRY_IMAGE:$BASENAME-$SHORT_SWIFT_VERSION-latest
    else
      IMAGE=$CI_REGISTRY_IMAGE:$BASENAME-$SHORT_SWIFT_VERSION-$CI_COMMIT_REF_NAME
    fi
    echo IMAGE: $IMAGE
    
    if [ $SWIFT_VERSION = "6.4.beta" ]; then
      SWIFT_IMAGE=swiftlang/swift@sha256:805c5f57d2cb73adfee6821813afbc411d414e885122dd13a741c5192e74ce57  # swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-07-23-a swiftlang/swift:nightly-6.4.x-jammy
    else
      SWIFT_IMAGE=swift:$SWIFT_VERSION-jammy
    fi
    echo SWIFT_IMAGE: $SWIFT_IMAGE

    docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
    docker build --pull -t $IMAGE --build-arg SWIFT_IMAGE=$SWIFT_IMAGE \
      -f Dockerfile.$BASENAME .
    docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
    docker push $IMAGE
    docker system prune -f || true


build wasm image:
  stage: base
  only:
    - main
    - tags
    - branches
  services:
    - docker:dind
  variables:
    # This instructs Docker not to start over TLS, which is often easier
    # for basic setups on shared runners.
    DOCKER_TLS_CERTDIR: ""
    FF_NETWORK_PER_BUILD: "true"
  parallel:
    matrix:
      - SWIFT_VERSION:
          # Make sure these are handled in the case statement below
          - '6.4.beta'
          - '6.3.2'
          - '6.2.0'
          - '6.1.3'
  script: |
    BASENAME=wasm
    
    SHORT_SWIFT_VERSION=${SWIFT_VERSION%.*}  # 5.7.3 -> 5.7
    if [ -n "$CI_COMMIT_TAG" ]; then
      IMAGE=$CI_REGISTRY_IMAGE:$BASENAME-$SHORT_SWIFT_VERSION-$CI_COMMIT_TAG
    elif [ "$CI_COMMIT_REF_NAME" = "$CI_DEFAULT_BRANCH" ]; then
      IMAGE=$CI_REGISTRY_IMAGE:$BASENAME-$SHORT_SWIFT_VERSION-latest
    else
      IMAGE=$CI_REGISTRY_IMAGE:$BASENAME-$SHORT_SWIFT_VERSION-$CI_COMMIT_REF_NAME
    fi
    echo IMAGE: $IMAGE
    
    SWIFT_IMAGE=swift:$SWIFT_VERSION-jammy
    
    case $SWIFT_VERSION in
      6.4.beta)
        SWIFT_IMAGE=swiftlang/swift@sha256:805c5f57d2cb73adfee6821813afbc411d414e885122dd13a741c5192e74ce57  # swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-07-23-a swiftlang/swift:nightly-6.4.x-jammy
        TAG=swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-07-23-a
        SDK_URL=https://download.swift.org/swift-6.4.x-branch/wasm-sdk/${TAG}/${TAG}_wasm.artifactbundle.tar.gz
        CHECKSUM=643c2932dbff596f5f74c77801d5f233ffd09f3fe2925b3f91606cd6d4b153b1
        ;;
      6.3.2)
        # check https://www.swift.org/documentation/articles/wasm-getting-started.html for
        # the latest SDK_URL and CHECKSUM
        SDK_URL=https://download.swift.org/swift-6.3.2-release/wasm-sdk/swift-6.3.2-RELEASE/swift-6.3.2-RELEASE_wasm.artifactbundle.tar.gz
        CHECKSUM=a61f0584c93283589f8b2f42db05c1f9a182b506c2957271402992655591dd7c
        ;;
      6.2.0)
        SDK_URL=https://download.swift.org/swift-6.2-release/wasm/swift-6.2-RELEASE/swift-6.2-RELEASE_wasm.artifactbundle.tar.gz
        CHECKSUM=fe4e8648309fce86ea522e9e0d1dc48e82df6ba6e5743dbf0c53db8429fb5224
        ;;
      6.1.3)
        TAG=6.1-RELEASE
        SDK_URL=https://github.com/swiftwasm/swift/releases/download/swift-wasm-${TAG}/swift-wasm-${TAG}-wasm32-unknown-wasi.artifactbundle.zip
        CHECKSUM=7550b4c77a55f4b637c376f5d192f297fe185607003a6212ad608276928db992
        ;;
    esac
    
    echo SWIFT_IMAGE: $SWIFT_IMAGE
    echo DOCKERFILE: $DOCKERFILE
    
    docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
    docker build --pull -t $IMAGE \
      --build-arg SWIFT_IMAGE=$SWIFT_IMAGE \
      --build-arg SDK_URL=$SDK_URL \
      --build-arg CHECKSUM=$CHECKSUM \
      -f Dockerfile.$BASENAME .

    docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
    docker push $IMAGE
    docker system prune -f || true


build android image:
  stage: base
  only:
    - main
    - tags
    - branches
  services:
    - docker:dind
  variables:
    # This instructs Docker not to start over TLS, which is often easier
    # for basic setups on shared runners.
    DOCKER_TLS_CERTDIR: ""
    FF_NETWORK_PER_BUILD: "true"
  parallel:
    matrix:
      - SWIFT_VERSION:
          - '6.4.beta'
          - '6.3.2'
          - '6.2.0'
          - '6.1.3'          
  script: |
    BASENAME=android
    
    SHORT_SWIFT_VERSION=${SWIFT_VERSION%.*}  # 5.7.3 -> 5.7
    if [ -n "$CI_COMMIT_TAG" ]; then
      IMAGE=$CI_REGISTRY_IMAGE:$BASENAME-$SHORT_SWIFT_VERSION-$CI_COMMIT_TAG
    elif [ "$CI_COMMIT_REF_NAME" = "$CI_DEFAULT_BRANCH" ]; then
      IMAGE=$CI_REGISTRY_IMAGE:$BASENAME-$SHORT_SWIFT_VERSION-latest
    else
      IMAGE=$CI_REGISTRY_IMAGE:$BASENAME-$SHORT_SWIFT_VERSION-$CI_COMMIT_REF_NAME
    fi
    echo IMAGE: $IMAGE
    
    SWIFT_IMAGE=swift:$SWIFT_VERSION-jammy
    
    case $SWIFT_VERSION in
      6.4.beta)
        # all variables are hardcoded in Dockerfile.android-6.4 for now
        ;;
      6.3.2)
        # all variables are hardcoded in Dockerfile.android-6.3 for now
        ;;
      6.2.0)
        # all variables are hardcoded in Dockerfile.android-6.2 for now
        ;;
      6.1.3)
        SDK_URL=https://source.skip.tools/swift-android-toolchain/releases/download/6.1/swift-6.1-RELEASE-android-24-0.1.artifactbundle.tar.gz
        CHECKSUM=f8696e3e84111b8c2c6f6e564b6266357987ea8d4aa3b2cf92f144357acde1c9
        ;;
      *)
        echo Unsupported Swift version: $SWIFT_VERSION
        exit 1
        ;;
    esac
    
    echo SWIFT_IMAGE: $SWIFT_IMAGE
    
    docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
    docker build --pull -t $IMAGE \
      --build-arg SWIFT_IMAGE=$SWIFT_IMAGE \
      --build-arg SDK_URL=$SDK_URL \
      --build-arg CHECKSUM=$CHECKSUM \
      -f Dockerfile.$BASENAME-$SHORT_SWIFT_VERSION .

    docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
    docker push $IMAGE
    docker system prune -f || true

build custom docc image:
  stage: derived
  only:
    - main
    - tags
    - branches
  services:
    - docker:dind
  variables:
    # This instructs Docker not to start over TLS, which is often easier
    # for basic setups on shared runners.
    DOCKER_TLS_CERTDIR: ""
    FF_NETWORK_PER_BUILD: "true"
  parallel:
    matrix:
      - SWIFT_VERSION:
          # for the derived images we don't deal with Swift patch versions
          - '6.3'
          - '6.2'
  script: |
    BASENAME=custom-docc
    # for the derived images we don't deal with Swift patch versions
    SHORT_SWIFT_VERSION=$SWIFT_VERSION
    if [ -n "$CI_COMMIT_TAG" ]; then
      BASE_IMAGE=$CI_REGISTRY_IMAGE:basic-$SHORT_SWIFT_VERSION-$CI_COMMIT_TAG
      IMAGE=$CI_REGISTRY_IMAGE:$BASENAME-$SHORT_SWIFT_VERSION-$CI_COMMIT_TAG
    elif [ "$CI_COMMIT_REF_NAME" = "$CI_DEFAULT_BRANCH" ]; then
      BASE_IMAGE=$CI_REGISTRY_IMAGE:basic-$SHORT_SWIFT_VERSION-latest
      IMAGE=$CI_REGISTRY_IMAGE:$BASENAME-$SHORT_SWIFT_VERSION-latest
    else
      BASE_IMAGE=$CI_REGISTRY_IMAGE:basic-$SHORT_SWIFT_VERSION-$CI_COMMIT_REF_NAME
      IMAGE=$CI_REGISTRY_IMAGE:$BASENAME-$SHORT_SWIFT_VERSION-$CI_COMMIT_REF_NAME
    fi
    echo BASE_IMAGE: $BASE_IMAGE
    echo IMAGE: $IMAGE
    docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
    docker build --pull -t $IMAGE --build-arg BASE_IMAGE=$BASE_IMAGE \
      -f Dockerfile.$BASENAME .
    docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
    docker push $IMAGE
    docker system prune -f || true
